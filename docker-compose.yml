services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoservice
    ports:
      - "5432:5432"
    volumes:
      - autoservice-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoservice"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  autoservice-pgdata:
